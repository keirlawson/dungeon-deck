[package]
name = "dungeon-deck"
version = "2.4.1"
edition = "2024"
license = "MIT"

[dependencies]
paho-mqtt = { version = "0.14.0", features = ["vendored-ssl"]}
rodio = { version = "0.22.2", features = ["symphonia-all", "symphonia-simd"] }
streamdeck = { git = "https://github.com/keirlawson/rust-streamdeck.git", branch = "one-index-revised-mini" }
serde = { version = "1.0", features = ["derive"] }
toml = "1"
anyhow = "1.0.75"
log = "0.4.20"
env_logger = "0.10.0"
ctrlc = { version = "3.4.1", features = ["termination"] }
image = "0.25.1"
imageproc = "0.24.0"
ab_glyph = "0.2.25"
m3u = "1.0.0"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
strip = "symbols"
